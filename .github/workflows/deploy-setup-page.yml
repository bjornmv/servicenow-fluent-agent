name: Deploy setup page

on:
  push:
    branches: [main]
    paths:
      - setup.md
      - git-setup.md
      - payload/.agents/skills/win-git-bootstrap/**
      - payload/.agents/skills/sn-doc-lookup/**
      - tools/stage-setup-pages.cjs
      - tools/Invoke-SdkSetup.ps1
      - tools/test/setup-pages.test.cjs
      - tools/test/mingit-ssh-probe.test.cjs
      - tools/test/jsonc-settings.test.cjs
      - tools/test/vscode-terminal.test.cjs
      - tools/test/windows-git-environment.test.cjs
      - tools/test/docs-paths.test.cjs
      - tools/test/setup-sdk-capture.test.cjs
      - lib/jsonc-settings.cjs
      - lib/vscode-terminal.cjs
      - lib/windows-git-environment.cjs
      - bin/sn-fluent-agent.cjs
      - package.json
      - VERSION
      - .github/workflows/deploy-setup-page.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate setup documents and worker checksum
        run: node --test tools/test/setup-pages.test.cjs tools/test/mingit-ssh-probe.test.cjs tools/test/jsonc-settings.test.cjs tools/test/vscode-terminal.test.cjs tools/test/windows-git-environment.test.cjs tools/test/docs-paths.test.cjs tools/test/setup-sdk-capture.test.cjs
      - name: Stage setup pages and bootstrap download
        run: node tools/stage-setup-pages.cjs
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./_pages
          destination: ./_site
          future: true
          build_revision: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4